使保護層不足。"],["墊塊間距的規定，下列何者正確？",["#3：100 cm；#4：80 cm；#5 以上：60 cm","#3：60 cm；#4：80 cm；#5 以上：100 cm","三者皆為 60 cm","不論鋼筋大小皆為 150 cm"],1,"鋼筋愈細愈易下垂，墊塊間距愈小：#3 ≤ 60、#4 ≤ 80、#5 以上 ≤ 100 cm。"],["樓版筋常以 2 cm 厚墊塊墊高，但工人踩踏使鋼筋下垂，使保護層不足。書中建議的改善作法為何？",["墊塊加厚約 0.5 cm（或縮短墊塊跨距）","取消墊塊","改用木塊","減少鋼筋數量"],0,"墊塊宜酌予加厚 0.5 cm，使全面保護層達到最少 2 cm 的規定，或縮短墊塊跨距。"],["混凝土墊塊的抗壓強度要求為何？",["不需特別規定","至少等於所澆置混凝土強度，且經試驗合格","為澆置混凝土強度的一半","只需外觀完整"],1,"墊塊抗壓強度至少須等於所澆置混凝土強度並經試驗合格，避免被踩破而失去保護層。"],["柱與牆的垂直向鋼筋與側模之間，墊塊宜採用何種型式？",["平板型","圓洞型","木楔型","可省略"],1,"柱筋、牆筋墊塊宜採圓洞型（可套入鋼筋、不易掉落），以確保保護層厚度。"],["耐震設計中，相鄰兩支柱主筋的搭接位置，應錯開至少多少？",["10 倍鋼筋直徑","15 倍鋼筋直徑","25 倍鋼筋直徑","50 倍鋼筋直徑"],2,"柱筋搭接應設於非圍束區且應力較小處，相鄰兩支柱筋搭接位置須錯開至少 25 倍鋼筋直徑。"],["書中指出模板工程費約占鋼筋混凝土構造物造價的多少？",["約 5%","約 15%","約 35%","約 70%"],2,"模板工程屬假設工程，費用約占 RC 構造物造價 35%，圖上卻無組模圖，故需模板結構計算書與施工圖。"],["模板構材（角材等）的尺寸與間距，應如何決定？",["依工人經驗","依現有材料","經應力計算決定，並提送模板結構計算書供監造單位及業主審核","一律採用 9 cm×9 cm"],2,"一般現場多為 6 cm×6 cm 角材，不同於說明書的 9 cm×9 cm 以上，故尺寸與間距應經應力計算並送審。"],["模板縫隙漏漿，較正確的補縫材料為何？",["一分厚三夾板板條","報紙","厚約 0.1~0.2 mm 的鍍鋅鐵皮（較小縫隙可用矽利康）","水泥砂漿"],2,"三夾板不防水，遇水膨脹變形卡在混凝土內無法拆除，影響品質；宜用 0.1~0.2 mm 鍍鋅鐵皮。"],["以可調鋼管為模板支柱時，下列規定何者正確？",["支柱可連接使用","高度超過 3.5 m 時，每 2 m 內應設縱、橫向水平繫條","高度調整可用鋼筋替代金屬配件","高度超過 1 m 即不得使用"],1,"可調鋼管支柱不得連接使用；高度超過 3.5 m 時每 2 m 內設足夠強度的縱橫向水平繫條；調整高度須用制式金屬配件。"],["以排架（框式施工架）作模板支柱時，應設置的構件不包括下列何者？",["交叉斜撐材","水平繫條","可調型基腳座","以鋼筋點焊代替斜撐"],3,"排架須設交叉斜撐、水平繫條、橫架、鋼製頂板，底部用可調型基腳座調整在同一水平面，不得任意以鋼筋替代。"],["澆置混凝土時發現模板異常變形，應如何處理？",["繼續澆置、完工後補強","立即停止澆置並補強，經監造單位及業主同意後始可繼續","減慢澆置速度即可","加水稀釋混凝土"],1,"澆置時應派人隨時注意模板，異常或變形須立即停止澆置、補強，並經監造及業主同意後才繼續。"]],"c":[]},{"n":"隧道一：潛盾、探查與鑽炸","q":[["明挖覆蓋隧道工法的施工順序，下列何者正確？",["先開挖至底再施作連續壁","先於兩側施築連續壁或排樁，向下開挖並架設水平支撐，再施築底版、側牆、頂版，最後覆土","由隧道內側往外擴挖","先作頂版再開挖"],1,"明挖覆蓋適用市區：兩側連續壁或排樁→由地面往下開挖並架設水平支撐→施築底版、側牆、頂版→填土覆蓋恢復地面。"],["土壓平衡式潛盾機維持開挖面穩定的主要方式為何？",["充滿泥水艙的泥水壓","以螺運機（螺旋輸送機）排土，並以其迴轉數控制排土量，使土艙壓與地盤土壓、水壓平衡","壓縮空氣","降低地下水位"],1,"土壓平衡式靠螺運機排土並調整迴轉數控制土艙內泥土壓，螺運機的土栓作用可防止地下水噴漏。"],["泥水加壓式潛盾機以何者維持開挖面穩定？",["螺運機土栓","較自然水壓大的泥水壓（泥水艙）","地盤改良","人工支撐"],1,"在切削機頭後裝設隔鈑，利用充滿泥水艙的泥水壓大於自然水壓來穩定開挖面，並以排泥管將土砂以流體狀態送出。"],["泥水加壓式潛盾工法的特點，下列何者正確？",["開挖土砂可直接以卡車運棄，不需處理","可克服滯水砂層、砂礫層等高水壓崩壞性地盤；開挖土砂須經泥水處理設備處理後才可運棄","不適用於海底、河底","必須配合大規模地盤穩定工法"],1,"泥水壓式適用高水壓崩壞性地盤與海底、河底，因泥水壓可穩定開挖面故無需地盤穩定工法，但棄土須經泥水處理設備。"],["土壓平衡式與泥水加壓式的出碴方式，下列敘述何者正確？",["土壓平衡式以螺旋輸送機配合皮帶出土；泥水式以排泥管循環排泥","兩者均以排泥管排泥","土壓平衡式以排泥管；泥水式以螺旋輸送機","兩者均不需出碴"],0,"土壓平衡式用螺運機＋皮帶或運碴台車；泥水式猶如反循環基樁工法，用排泥管循環排泥。"],["潛盾工法的優點，下列何者「不」正確？",["無山損隧道鑽炸施工的風險","振動、噪音及交通阻礙等公害小","施工所需場地空間較小","在軟弱地盤也絕對不會發生地盤沉陷"],3,"潛盾雖能將地盤沉陷減至最低，但在軟弱地盤仍可能發生沉陷。"],["新奧工法（NATM）的基本概念，下列何者正確？",["完全由鋼支撐承擔全部岩壓","由一次襯砌形成的岩石環拱來承擔四周岩壓，並減少超挖與擾動、採平滑爆破","儘量擾動周圍岩盤使應力釋放","開挖後不需立即支撐"],1,"NATM 重點：減少超挖與擾動（平滑爆破使開挖面圓順，避免應力集中）、避免周圍岩盤鬆動、儘快保持三軸應力與平衡，開挖後立即建立一次襯砌支撐。"],["隧道前方震波探測（TSP）一般可探測開挖面前方約多遠範圍的地層狀況？",["約 5~10 m","約 100~200 m","約 1~2 km","約 5 km"],1,"TSP 可探測開挖面前方約 100~200 公尺內的地層強度、斷層、破裂帶及地下水狀況並提出預警，能量源為埋設於炸孔的炸藥。"],["鑽炸法的「鑽」與「炸」分別指什麼？",["鑽：以鑽堡機鑽出炸藥孔；炸：裝填炸藥並以雷管、導爆索等引爆碎岩","鑽：鑽取岩心；炸：沖水","鑽：挖土機開挖；炸：灌漿","兩者皆指鑽探取樣"],0,"鑽炸法是隧道在岩盤區域施工最主要的方法：先鑽炸藥孔，再填藥並引爆。"],["導爆索的藥芯成分與爆速為何？",["TNT；約 500 m/s","PETN；爆速在 6,000 m/s 以上","硝酸銨；約 100 m/s","黑火藥；約 10 m/s"],1,"導爆索由強力、可彎曲、輕量的 PETN 藥芯組成，爆速在 6,000 m/sec 以上。"],["LP 遲發非電氣雷管使用上的規定，下列何者正確？",["可在任何溫度砲孔內使用","不可在高於攝氏 65 度的砲孔內使用，並應採「逆向起爆」（雷管指向砲孔口）","必須正向起爆","只能在乾燥無水的砲孔使用"],1,"LP 遲發非電氣雷管具分段引爆功能，可避免電雷管的漏電問題；但不可用於高於 65°C 的砲孔，砲孔內採逆向起爆。"],["在崩積層等軟弱區域開挖，為避免坍塌，常先採用何種補強工法？",["先撐管冪工法（Pipe Umbrella Roofing）","加大炸藥量","全面降低支撐","直接爆破"],0,"軟弱區域先以先撐管冪補強；若太軟弱，開挖區先打設玻璃纖維管強化土體，並以噴凝土封面避免坍塌。"]],"c":[]},{"n":"隧道二：噴凝土、岩栓與襯砌","q":[["噴凝土施工時，噴嘴的操作要求為何？",["傾斜 45 度、距離 10 cm","垂直噴射面，距離約 80~100 cm；受地形限制時夾角不得小於 80 度","距離越近越好","隨工人習慣"],1,"施噴時噴嘴須垂直於噴射面，距離約 80~100 cm，夾角不得小於 80 度，並先噴低處或角隅等易堆積反彈料處。"],["噴凝土所用速凝劑的品質規定，氯化物含量不得超過自重的多少？",["0.1%","1%","5%","10%"],1,"速凝劑氯化物含量及 Na₂O 鹼當量（Na₂O+0.658K₂O）均不得超過自重的 1%；施工須使用速凝劑計量設備控制添加量。"],["噴凝土不得添加下列何種摻料，因其會導致緩凝？",["速凝劑","飛灰及高爐石粉","鋼纖維","水"],1,"噴凝土不得添加飛灰、高爐石粉等導致緩凝的添加料。"],["噴凝土用鋼線網的安裝規定，下列何者正確？",["離開挖面越遠越好","須貼近開挖面安裝並固定牢靠，搭接長度至少 20 cm","免固定，噴凝土時自然固定","搭接 5 cm 即可"],1,"鋼線網須儘可能貼近開挖面安裝、確實固定（固定點間距依工程司指示或不大於 1.0 m），搭接長度至少 20 cm。"],["SN 岩栓錨固料包的規定，一個料包應能承受至少多少拉拔力？",["1.5 tons","5 tons","15 tons","150 tons"],2,"SN 岩栓錨固料包通常以玻璃管包裝（直徑約 25 mm），一包應能承受至少 15 tons 拉拔力，氯化物含量不得超過自重 1%。"],["SN 岩栓用水泥砂漿預拌包，水灰比與三天齡期抗壓強度要求為何？",["水灰比 0.35~0.45；三天抗壓強度 ≥ 310 kgf/cm²","水灰比 0.8~1.0；≥ 50 kgf/cm²","水灰比 0.1；≥ 1000 kgf/cm²","不需規定"],0,"以一份波特蘭一型水泥與一份 2 mm 以下級配矽砂拌合，水灰比 0.35~0.45，5 cm 立方試體三天抗壓強度達 310 kgf/cm² 以上。"],["隧道 PVC 防水膜兩片之間的搭接，下列何者正確？",["搭接至少 8 cm，採雙道熱熔接，兩道焊道中間留空氣通道供氣壓檢驗","對接不搭接","搭接 1 cm，以膠水黏貼","單道焊接即可"],0,"防水膜搭接至少 8 cm、雙道熱熔接，形成兩道 1 cm 寬焊道，中間 1 cm 空氣通道供氣壓檢驗；零星修補用手提式熱風焊接機。"],["防水膜鋪設的方向通常為何？",["由底部往頂拱","由隧道頂拱向兩側逐步攤平鋪設","任意方向","由一側拉到另一側"],1,"鋪設由隧道頂拱向兩側逐步攤平，並適度貼緊噴凝土面；非織物搭接長度至少 10 cm，固定塊間距小於 60 cm 且每 m² 不少於 4 塊。"],["隧道襯砌鋼筋施工，鋼筋與模板間的保護層墊塊與加工方式，下列何者正確？",["採熱彎加工；以木塊隔離","採冷彎（常溫彎曲）；以預製 1:1 水泥砂漿塊隔離（間距約 2.5 m×2.5 m）","可噴火加熱彎折","不需保護層"],1,"鋼筋應在常溫下冷彎；鋼筋與模板間以預製 1:1 水泥砂漿塊隔離（間距 2.5 m×2.5 m）以維持保護層（襯砌混凝土 5 cm）。"],["隧道襯砌混凝土的拆模時間，拱部鋼模原則上不得小於多久？",["2 小時","16 小時","3 天","28 天"],1,"拆模時間：側牆（木模單獨澆置）24 小時、拱部鋼模 16 小時、聯絡隧道及凹槽 24 小時、假隧道拱部 7 天。"],["隧道襯砌混凝土澆置的要求，下列何者「不」正確？",["每 1 模均需連續完成，不得形成冷縫","自由落下高度不超過 1.5 m","應考慮側壁澆置高度避免偏壓使鋼模變位","為加快進度，可在澆置中途停頓數小時"],3,"襯砌混凝土每模必須連續完成，不得中斷形成冷縫；落下高度 ≤ 1.5 m；兩側均勻澆置避免偏壓。"],["下列何者是新奧工法（NATM）「不適用」的隧道條件？",["岩盤完整乾燥","湧水量大，尤其地盤為石灰岩或黏土時","岩釘可正常施打","覆蓋層薄的硬岩"],1,"NATM 不適用於湧水量多（尤其石灰岩或黏土）、岩釘無法施打等情形。"]],"c":[]},{"n":"橋梁一：深基礎與下部結構","q":[["全套管基樁（搖管機）工法的優點，下列何者「不」正確？",["噪音及污染少","施工精度佳，孔底淤泥易於清除","可適應不同地質，較硬岩盤亦可施工","地下水位以下細砂層很厚時，套管拔出最容易"],3,"地下水位以下細砂層較厚時，套管拔出較為困難，是此工法的缺點之一；另需訓練專人操作與控制精度。"],["全套管基樁鋼筋籠的主筋續接，下列規定何者正確？",["以搭接為原則，且搭接須錯開，不得有 1/2 以上鋼筋在同一平面續接","全部在同一斷面續接","一律使用點焊代替搭接","不需錯開"],0,"主筋續接以搭接為原則並錯開排列，不得有 1/2 以上鋼筋在同一平面續接；三點電銲總長度不小於主筋直徑的五倍。"],["灌注水下混凝土時，特密管底端暫時懸吊離樁孔底約多少，不接觸孔底？",["約 2 cm","約 20 cm","約 2 m","直接頂住孔底"],1,"特密管暫時懸吊使底端離樁孔底約 20 cm，以免不慎堵塞。"],["全套管基樁灌注混凝土的一般控制，灌注速度與坍度為何？",["約 1~2 m³/hr；坍度 5 cm","約 15~20 m³/hr；坍度保持 18~20 cm","約 100 m³/hr；坍度 0 cm","不需控制"],1,"灌注速度一般為 15~20 m³/hr，坍度保持 18~20 cm 以利灌注，並隨時以水尺檢測混凝土上升高度。"],["每一根基樁灌注混凝土時，藉特密管連續進行，停頓時間原則上不超過多久？",["5 分鐘","30 分鐘","3 小時","1 天"],1,"須在混凝土初凝前，並在 2.5 小時內澆妥一根最大徑樁所需的混凝土，停頓時間以不超過 30 分鐘為原則。"],["拔出套管時，應確保套管底部至少埋入混凝土中多少？特密管至少埋入多少？",["套管 150 cm；特密管 2 m","套管 10 cm；特密管 10 cm","套管 5 m；特密管 10 m","兩者皆不需埋入"],0,"套管邊灌邊拔，底部至少埋入混凝土 150 cm，並考慮拔管時混凝土可能下降，確保特密管至少入混凝土 2 m。"],["全套管基樁超音波檢測的目的，主要是檢查什麼？",["混凝土的抗壓強度","樁孔實際挖掘的垂直精度","鋼筋數量","地下水位"],1,"利用音波在水中傳遞時間不同的原理觀測樁孔垂直精度；若孔內乾燥無地下水，則可用紅外線儀器量測。"],["井式基礎的施工注意事項，下列何者正確？",["混凝土澆注後立即停止抽水","混凝土須達預定強度方可停止抽水，施工中應隨時量測井筒真圓度","井筒不需量測","開挖越深越容易"],1,"井式基礎混凝土須達預定強度才可停止抽水；開挖出土運送隨深度增加愈困難，並應隨時量測井筒真圓度。"],["橋梁基礎（樁帽）混凝土厚度超過 1.5 m 時，底層澆置的塑膠軟管（青龍管）應如何擺放？",["放在模板外側傾倒","深入頂層鋼筋下方澆置，管口與澆置位置距離應小於 1.5 m","距離越遠越好","由高處自由落下"],1,"基礎厚度超過 1.5 m 時，青龍管應深入頂層鋼筋下方澆置，管口與澆置位置距離小於 1.5 m；拌合後超過 1.5 小時的混凝土須管控。"],["近年橋墩柱混凝土多採用何種混凝土，澆置完成次日應以高壓清洗機清除何物？",["自充填混凝土（SCC）；頂面乳沫及預留鋼筋上的混凝土渣","輕質混凝土；鋼筋鏽","瀝青混凝土；油污","纖維混凝土；雨水"],0,"墩柱混凝土多採自充填混凝土，澆置完成次日用高壓清洗機清除頂面乳沫（浮漿）及沾黏於預留鋼筋的混凝土渣。"],["帽梁（Cap Beam）支撐架的底部地面，應如何處理？",["直接擺放","確實滾壓夯實（必要時做平板載重試驗），再鋪 PC 無筋混凝土或鋼板等承壓材料","只需噴水","不需處理"],1,"地面須滾壓夯實並確認承載力，再鋪 PC 或鋼板分散支柱壓力；支撐系統設縱向、橫向繫桿並鋪設安全防墜網。"]],"c":[]},{"n":"橋梁二：上部結構與鋼橋","q":[["場撐（就地支撐）工法的特性，下列何者正確？",["適用斷面變化多樣及曲率半徑小的路線；不適合支撐高度太高（如大於 30 m）","適合支撐高度超過 30 m 的區段","技術門檻極高","不需要大量支撐架材料"],0,"場撐採現場逐跨施工、變化靈活，技術要求較低，但不適合高度太高（例如大於 30 m）的區段，支撐架材料量大且高架作業多。"],["支撐先進工法的特點，下列何者正確？",["需架設大量場撐，影響交通","無須架設場撐，不影響其他道路交通或河川水流；曲率半徑太小不適用（一般大於 400 m）","適用曲率半徑極小路線","初期設備投資成本低"],1,"支撐先進工法以工作車推進，無須場撐；初期設備投資高，但橋長 800 m 以上時具成本優勢，一般平面曲率半徑大於 400 m。"],["支撐先進工法在橋梁長度達多少以上時，具有降低成本的優勢？",["50 m","200 m","800 m 以上","不論長度皆較貴"],2,"工作車與模板可循環重複使用，橋梁長度在 800 m 以上時具成本優勢。"],["平衡懸臂工法一般適用的主跨徑範圍與節塊長度為何？",["主跨 5~10 m；節塊 1 m","主跨 70~200 m；節塊約 10~12 m","主跨 500~800 m；節塊 50 m","主跨 20 m 以下；節塊 30 m"],1,"以懸臂工作車於橋墩兩側平衡逐節施工，橋下不須支撐，適合跨越山谷、道路、河川，主跨徑 70~200 m，每節塊約 10~12 m。"],["平衡懸臂工法中，吊掛及固定用的鋼棒有什麼要求？",["可使用舊料","均需使用新品，且直徑尺寸管制嚴格、不可錯用，否則工作車有跌落風險","隨意選用","不需固定"],1,"吊掛及固定鋼棒均需使用新品，直徑尺寸需非常嚴格管制，錯用可能造成工作車跌落。"],["橋梁腹版混凝土應分層澆築，書中所列每層高度約為多少？",["約 5 cm","約 45 cm","約 3 m","一次澆完"],1,"橋梁腹版混凝土應分層澆築，每層高度約 45 cm，且上下兩層相隔時間不宜過長，避免冷縫。"],["橋梁鋼筋的最小保護層，橋面版底面、箱梁外側及胸牆為多少？",["10 mm","20 mm","40 mm","100 mm"],2,"橋面版底面、箱梁外側及胸牆 40 mm；箱梁內側、隔梁、預鑄胸牆及電纜溝槽 30 mm。"],["橋梁混凝土（預力）養護至強度達設計強度多少後，可施拉預力？",["20%","50%","80%（一般約 280 kgf/cm²）","120%"],2,"橋梁混凝土養護至設計強度 80%（一般約 280 kgf/cm²）後方可施拉預力；養護不得少於 7 天。"],["相較鋼筋混凝土橋，鋼結構橋樑的特點，下列何者正確？",["較耐震：材料強度/重量比高，總重較輕","重量比 RC 重很多","完全不需防銹","不可預鑄"],0,"鋼結構材料強度/重量比高，要達到相同強度，總重較輕，因此較耐震。"],["鋼橋螺栓孔以鑽孔（Drilling）施作時，所鑽孔應較螺栓直徑大多少？",["約 1.6 mm（1/16 吋）","約 16 mm","約 0.01 mm","不可大於螺栓"],0,"鑽孔或修鑽的孔徑較螺栓直徑大 1.6 mm（1/16″）；鑽孔時應先將數塊鋼板固定、一次鑽孔完成。"],["鋼橋以填角銲連接鋼材時，兩者間隙原則上不得大於多少？",["0.5 mm","5 mm（3/16 吋）","50 mm","可任意大小"],1,"填角銲連接的鋼材須儘量密接，間隙不得大於 5 mm（3/16″）；一般情況下間隙不得以墊片或其他金屬材料填充。"],["鋼橋銲接作業的環境限制，下列何者正確？",["可在 −18°C 以下作業","不得在 −18°C 以下、濕面、濕度 90% 以上或強風下銲接","雨天最適合","沒有限制"],1,"銲接不得在 −18°C 以下、濕面、濕度 90% 以上、強風或雨雪環境下施工，除非有防護措施。"]],"c":[]},{"n":"擋土支撐與開挖","q":[["主樁橫板條工法（型鋼樁、鋼軌樁）的施作方式為何？",["H 型鋼等主樁每隔一定間隔（通常不大於 100 cm）打設，開挖時於樁間嵌入橫板條（一般採約 30 mm 厚木板）並背後填土","連續灌注混凝土牆","以泥水平衡壁體","只挖溝不打樁"],0,"主樁橫板條工法：型鋼或鋼軌樁間隔通常不大於 100 cm，樁間嵌入橫板條構成擋土壁；勁度較低、防水性較差，常用於淺層開挖（橋梁基礎使用普遍）。"],["主樁橫板條工法的缺點，下列何者「不」正確？",["打設或拔除主樁時震動、噪音可能影響鄰房","主樁拔除後遺留空洞，可能造成鄰近地層下陷","遇堅硬礫石層易偏斜、影響垂直度","防水性極佳，可擋水擋砂"],3,"此工法勁度較低且防水性較差，擋土側土壤可能流失造成鄰近地面沉陷。"],["鋼板樁打設時，在打樁周圍 30 m 範圍內若有不足幾天齡期的混凝土，不得打設？",["1 天","3 天","7 天","28 天"],2,"打樁周圍 30 m 範圍內如有不足 7 天齡期的混凝土，不得打樁，以免震動損害早期混凝土。"],["鋼板樁施打前，下列作法何者正確？",["直接打設，遇障礙再說","先進行探查試挖，樁位處有障礙物須先排除；詳細檢查樁槽縫是否彎曲受損","可省略放樣","槽縫受損也可使用"],1,"鋼板樁施打前應放樣、探查試挖排除障礙物並檢查槽縫；吊裝盡量利用樁頂吊孔；一般分 2~4 次來回打入以維持打設方向。"],["鋼板樁工法的限制，下列何者正確？",["設計深度不受打樁機能量限制","土中有大卵石或石塊時，打設難度極高；設計深度受打樁機能量限制","完全無震動噪音","不需考慮鄰房影響"],1,"振動打樁機雖可調整頻率仍有震動及噪音，施工前需對鄰房做現況鑑定；遇障礙物難度極高且深度受機具能量限制。"],["人工擋土柱（人工挖掘）的優勢為何？",["施工所需作業空間較無限制、開挖時幾乎無噪音","施工速度最快","無需任何人力","可用於任何深度"],0,"人工擋土柱作業空間不受限、噪音小；挖掘時每 2~3 m 深潑灑水泥漿穩固壁體。"],["「安全支撐」系統主要由哪些構件組成？",["擋土壁、中間柱、圍囹（圍檁）、水平支撐","只有擋土壁","只有水平支撐","地錨與混凝土牆"],0,"支撐系統包含擋土壁（連續壁、鋼板樁、排樁等）、中間柱、圍囹、水平支撐。"],["水平支撐開挖的控制：每層開挖深度至多不得超過支撐構件底部以下多少？",["10 cm","60 cm","5 m","沒有限制"],1,"開挖深度不得超過支撐構件底部以下 60 cm，預壓力施加完成後方得繼續開挖；各支撐底部應距樓板面至少 40 cm。"],["開挖與支撐施工的原則，下列何者正確？",["慢挖慢撐","超挖再回填","快挖快撐，不得超挖；開挖達設計深度立即施作結構本體","先挖到底再架支撐"],2,"應依設計各階段深度施工，快挖快撐、不得超挖（擾動土壤會降低被動土壓）；達設計深度立即施作結構本體，達設計強度後才依序拆撐。"],["圍囹與擋土壁之間的背填混凝土，需待混凝土充分硬化後才可施加預壓或拆除，書中建議至少多久？",["1 小時","6 小時","24 小時以上","7 天"],2,"圍囹與擋土壁間的背填混凝土須充分硬化（澆置完成後 24 小時以上）後再施加預壓力，且圍囹與支撐應密接以使土壓平均分佈。"],["若有打設中間柱，相鄰中間柱之間應如何處理？",["不需連接","加設交叉拉桿構件；對接焊道應滿銲","只點焊即可","以木材連接"],1,"中間柱連接需符合規定，對接焊道應滿銲，相鄰中間柱間加設交叉拉桿構件以增加穩定。"]],"c":[]},{"n":"地盤改良工法","q":[["下列何者屬於書中所列的地盤改良工法？",["CCP 高壓噴射樁、JSG 高壓噴射灌漿樁、三軸（SMW）攪拌樁","搖管機基樁","鋼板樁","排樁"],0,"地盤改良工法包括 CCP、JSG、大口徑高壓噴射改良樁（二重管）、三軸（SMW）攪拌樁、雙環塞灌漿等。"],["CCP 高壓噴射樁施工時，鑽桿迴轉速度一般應保持在多少？",["約 0.5 RPM","約 8~12 RPM","約 100 RPM","約 1000 RPM"],1,"CCP 施工中鑽桿迴轉速度應保持在約 8~12 RPM，並依規劃速度提高鑽桿；灌漿壓力約 180~220 kgf/cm²。"],["CCP 高壓噴射樁施工前的重要準備工作為何？",["直接鑽孔","先確認並排除地下障礙物，確認既有管線位置與深度","先灌漿再鑽孔","只需放樣"],1,"施工前須試挖確認地下障礙物與既有管線位置深度，可遷移者先遷移，不可遷移者須妥善防護，以免受損。"],["CCP 灌漿時若須拆管清洗再接樁，鑽桿應加深至原灌注高程下至少多少再繼續？",["2 cm","20 cm","2 m","不需加深"],1,"為避免成形樁發生斷裂，灌注時如須拆管清洗，應將鑽桿加深至原灌注高程下約 20 cm 處再灌，使接樁與原樁結合。"],["JSG 高壓噴射灌漿樁，樁徑 60、120、150 cm 時，噴射水泥漿的壓力約為多少？",["三者都是 20 kgf/cm²","180~200、230~250、280~300 kgf/cm²","1~2 kgf/cm²","三者都是 1000 kgf/cm²"],1,"JSG 依樁徑 60/120/150 cm 分別以 180~200、230~250、280~300 kgf/cm² 高壓水泥漿水流（約 100±10 L/min）及 7~10 kgf/cm² 以上氣流沖碎土壤並混合。"],["高壓噴射改良的原理，下列何者正確？",["以高壓水泥漿水流（及氣流）沖碎周圍土壤，使土砂與水泥漿混合固化成改良體","把土壤整個挖除","降低地下水位","打入鋼板樁"],0,"高壓噴射利用高速噴流切削土體並使土砂與水泥漿攪拌混合，形成固結的改良體，可靠成效深度至少可達 40 m 以上。"],["地盤改良施工時，應隨時注意鄰近地面的什麼異常？",["不正常的隆起現象","顏色變化","氣溫","風向"],0,"施工中應隨時注意鄰近四周地面是否有不正常的隆起，並控制鑽孔垂直度（以垂球校正）、確認口徑與長度。"],["在管線附近施作高壓噴射改良，為避免破壞管線，灌漿壓力應如何調整？",["提高壓力以加快施工","改以低壓方式（<20 kgf/cm²）進行","不變","改用空氣"],1,"靠近管線時避免破壞，改以低壓（約小於 20 kgf/cm²）灌漿。"],["雙環塞灌漿的灌漿外管，出漿孔設置為何？",["不開孔","每 33 cm（或 50 cm）開四處 1 cm 出漿孔","每 10 m 一孔","全管開孔"],1,"灌漿外管每 33 cm（或 50 cm）開四處約 1 cm 的出漿孔，植入套管後拔除套管；灌漿採上升方式，每階段提昇內灌漿管 33 cm。"],["雙環塞灌漿的灌注方式，下列何者正確？",["由上往下一次灌完","採上升方式，每階段提昇內灌漿管 33 cm，逐段灌漿，到設計頂部高度停止","隨機位置灌漿","僅灌孔底"],1,"灌漿採上升方式逐階段提昇內灌漿管，到灌漿設計頂部高度時停止，完成一孔；每孔灌漿後檢視各深度注入量與注入壓力記錄。"]],"c":[]},{"n":"監測管理與緊急應變","q":[["一般監測管理值分為哪三個等級？",["安全值、警戒值、行動值","綠燈、黃燈、紅燈、黑燈","初值、中值、終值","設計值、施工值、完工值"],0,"管理值三級：第一級安全值、第二級警戒值、第三級行動值，依監測值逐級提升管制措施。"],["監測值達到「警戒值」時，應採取的措施為何？",["完全不處理","提高監測頻率、準備緊急應變計畫、進行回饋分析，必要時修改施工程序或補救","立即全面撤離並拆除結構","降低監測頻率"],1,"警戒值約為行動值的 80%：可審慎繼續工程，但應變機制進入整備階段，須提高監測頻率、重新檢討（回饋分析）並準備應變計畫。"],["監測值達到「行動值」時，一般應如何處理？",["繼續照常施工","停止施工並啟動應變機制，待條件改善或不良狀況排除後才恢復施工","只增加監測點","只通知業主即可"],1,"行動值代表工程安全可容許的界限或設計不能超越的應力/變位，到達時停止施工並啟動應變機制。"],["監測值達到設計分析預期值的多少比例時，「安全值」範圍內就需多加注意？",["10%","50%","80%","120%"],2,"安全值範圍內，達設計預期值 80% 時需多加注意，此範圍內施工作業正常，監測頻率依原規劃進行。"],["擋土壁面出現大量漏水（可能夾帶砂土）時，首先應如何處理？",["繼續開挖以趕工","立即停止開挖，出水處先回填砂土或以大量砂包堵水，並謹慎研判灌漿止漏","立即灌最大壓力的漿","在旁邊加挖一個洞"],1,"應立即停止開挖並堵水；灌漿壓力可能對擋土設施增加負荷，須謹慎檢討使用，並檢修管線、檢查鄰房與路面受損情形。"],["水壓計或水位觀測井埋設完成後，地表下 50 cm 至地表面應如何處理？",["以水泥砂漿回填，並做防護措施及警示標誌","保持空洞","填垃圾","不處理"],0,"水位觀測井與水壓計埋設後，以水泥砂漿回填地表下 50 cm 至地表面，並設置防護措施及警示標誌。"],["支撐應變計通常安裝在 H 型鋼支撐的什麼位置？它的初始值何時測定？",["焊於 H 型鋼梁腹中央；同一層所有應變計皆裝妥後測初始值，再進行支撐預壓","貼在翼緣外側，預壓後再測初始值","隨意位置，不需初始值","安裝在混凝土內"],0,"支撐應變計焊於經除鏽處理的 H 型鋼梁腹中央；一層所有應變計的初始值測定完成後，才可進行預壓施工。"],["裂縫計的裂縫寬度計算，下列何者正確？",["裂縫寬度 = 原有寬度 + 變化量；變化量 = 觀測讀值 − 初始讀值","裂縫寬度 = 初始讀值 × 觀測讀值","裂縫寬度 = 原有寬度 − 初始讀值 × 2","沒有公式"],0,"裝設前先以裂縫尺測讀原有寬度並記錄；裂縫寬度 = 原有寬度 + 裂縫寬度變化量，其中變化量 = 觀測讀值 − 初始讀值。"],["連續壁內傾度管的安裝方式，下列何者正確？",["每段以套管接頭連接並對正軌道圍槽、塗凝結膠，配合鋼筋籠以固定環固定在籠內","直接丟入溝槽","不需對正軌道","用電焊焊在鋼筋上"],0,"傾度管每段以套管接頭連接，軌道圍槽對正並塗凝結膠固定，配合鋼筋籠製作以固定環固定在鋼筋籠內。"],["感測器（傳感器）的選用，下列何者正確？",["量程不需留餘量","量程需留有餘量，並避開高溫、靜電、電磁等干擾","應盡量靠近電焊機","只能在室內使用"],1,"傳感器量程需留餘量並避開緩衝區；安裝使用應避開高溫、高輻射、靜電、高頻及電磁干擾。"]],"c":[]},{"n":"地下連續壁施工","q":[["連續壁導溝的開挖深度規定，下列何者正確？",["至少 1.8 m，但以超過回填層至原土層為原則","至多 0.2 m","不需開挖","固定 10 m"],0,"導溝開挖深度規定至少 1.8 m，且以超過回填層至原土層為原則；兩側須修齊、底部整平以減少模板困難及混凝土損耗。"],["導溝每次開挖長度，一般以多少為原則（鄰房側另行考量，可縮短）？",["20~30 m","1~2 m","100~200 m","沒有限制"],0,"開挖長度每次以 20~30 m 為原則（鄰房側適度縮短如 10~15 m），避免因天候、時程影響造成崩塌而需二次開挖。"],["導溝模板組立時，導牆之間的最小距離應為多少？",["連續壁厚度加 5 cm","連續壁厚度減 5 cm","等於 1 m","連續壁厚度的 3 倍"],0,"導牆最小距離為連續壁厚度加 5 cm，導牆面應垂直；導溝精度對連續壁精度影響甚大。"],["連續壁開挖（抓掘）至設計深度時，如何檢測深度與垂直度？",["深度用水尺檢測，垂直度用超音波測定","兩者皆用肉眼","兩者皆不需檢測","垂直度以口頭詢問"],0,"開挖至設計深度時以水尺檢測，垂直度以超音波測定；操作手應隨時注意偏位計指針，垂直度不佳立即修正。"],["連續壁水中混凝土灌注速度一般約為多少？",["約 0.5 m³/hr","約 30~50 m³/hr","約 500 m³/hr","不需控制"],1,"灌注速度一般 30~50 m³/hr，且不可集中於某一支特密管灌注，應平均灌注，避免產生包泥現象。"],["連續壁混凝土澆置前，特密管上方漏斗內應備妥什麼？",["硬質栓塞（橡皮碗），隨混凝土向下擠出管內泥水","鋼筋","氣球","棉花"],0,"在漏斗內備妥擠壓特密管中泥水的硬質栓塞（橡皮碗），再灌入混凝土，避免混凝土遭汙染變質。"],[" ,"應設計開挖面高程較洞口高程徐徐升高（上坡掘進），讓地下水自然流向洞口排出。"],["甲烷（CH₄）的爆炸極限濃度範圍約為多少？",["0.1%~0.5%","5%~15%","30%~50%","80%~100%"],1,"甲烷為易燃氣體，濃度達 5%~15%（爆炸極限）遇火源或高溫設備可能爆炸；通風不良時會積聚在隧道上方。"],["硫化氫（H₂S）的危害，下列何者正確？",["無毒","劇毒氣體，濃度超過 100 ppm 即有嚴重危害，500 ppm 以上可能數分鐘內致命","僅有臭味無害","只在海上存在"],1,"硫化氫為劇毒氣體，可能來自含硫岩層或積水腐敗；濃度超過 100 ppm 即危害嚴重，500 ppm 以上可能在數分鐘內致命。"],["二氧化碳（CO₂）濃度過高的危害，下列何者正確？",["超過 3% 可能引起呼吸困難，超過 10% 會導致昏迷甚至死亡","完全無害","只會使人興奮","只在 0.01% 以下有害"],0,"CO₂ 濃度過高會造成缺氧：超過 3% 可能呼吸困難，超過 10% 可能昏迷甚至死亡。"],["隧道內一氧化碳（CO）的主要來源為何？",["機具燃燒柴油","岩石風化","地下水","混凝土水化"],0,"CO 主要來自隧道內機具燃燒柴油，通風不良會累積形成隱形中毒風險。"],["隧道通風規劃，當風管輸送距離過長（超過 800 m）時應如何處理？",["不需處理","於隧道內另設置送風機接力輸送新鮮空氣至開挖面","縮短風管直徑","關閉送風"],1,"洞口設置大能量送風設備與特製風管將新鮮空氣送至開挖面；風管超過 800 m 時另設送風機接力；並設置多功能有害氣體偵測器與警報。"],["岩爆（Rock Burst）最容易發生於哪種隧道環境？",["淺覆蓋的軟弱黏土","覆蓋層深（如超過 500 m）、堅硬岩層或高岩盤應力地層","海底沉泥","砂礫層"],1,"岩爆常發生於覆土深、岩質堅硬或高岩盤應力地層（如變質岩、花崗岩），應力釋放過快時岩塊彈射。"],["預防岩爆的對策，下列何者「不」正確？",["於鋼支保設置應力計即時監測","預鑽應力釋放孔讓應力緩慢釋放","開挖後立即施作一次襯砌（高風險可用鋼纖維噴凝土）","延後一次襯砌，讓岩盤充分暴露"],3,"一次襯砌（鋼支保、掛網噴凝土、岩栓）未即時施作會使圍岩無法形成應力平衡而破裂，應於開炸後立即施作。"]],"c":[]},{"n":"連續壁與預力常見缺失","q":[["預拌混凝土出廠後超過多久尚未澆置，必須退料？",["10 分鐘","30 分鐘","90 分鐘","12 小時"],2,"出廠後超過 90 分鐘尚未澆置的混凝土必須退料；連續壁澆置時混凝土中斷時間應控制在 30 分鐘內。"],["連續壁導溝設計：外側導牆與內側導牆的高度關係，應如何？",["外側導牆應高於內側導牆約 5~10 cm，以防止穩定液外溢","兩者越低越好","內側高於外側 1 m","沒有要求"],0,"導牆截水措施：外側導牆應高於內側導牆約 5~10 cm，防止地表水流入、穩定液外溢。"],["連續壁導溝內淨寬，應大於連續壁厚度約多少？",["約 5 cm","約 0 cm","約 1 m","約 5 m"],0,"導溝淨寬應大於連續壁厚度約 5 cm，以利抓掘機（MASAGO）作業；導溝完成拆模後每 3~5 m 以內撐支撐淨寬。"],["連續壁外轉角單元的導溝，應如何處理才能使抓斗確實抓掘？",["不需加長","將轉角單元任一側導溝向外延伸約 50 cm","向內縮短 50 cm","延伸 10 m"],1,"外轉角單元之導溝未外伸，抓斗無法確實抓掘；應將轉角單元任一側導溝向外延伸約 50 cm。"],["連續壁穩定液的比重範圍，書中建議約為多少？",["約 0.1~0.5","約 1.05~1.2","約 3~5","約 10~20"],1,"穩定液比重與黏度要適當（比重約 1.05~1.2），增加開挖壁體側向支撐力避免坍塌；水位保持在槽溝壁頂下方約 50 cm。"],["連續壁混凝土灌注時，特密管至少須埋入混凝土中多深？",["至少 2 m","至少 5 cm","完全不埋入","至少 100 m"],0,"特密管必須埋入混凝土中至少 2 m，其長度應延伸至距槽溝底部約 20 cm 處，避免混凝土與穩定液混合形成劣質混凝土。"],["SMW 三軸攪拌樁施工時，相鄰樁的重疊範圍應確保多少以上？",["30% 以上","3% 以上","0%","1% 以下"],0,"SMW 三軸攪拌樁應確保重疊範圍達 30% 以上，避免搭接區止水或強度不足。"],["預力混凝土施拉預力前，混凝土強度至少須達設計強度的多少？",["20%","50%","80 const ms=[["完成挑戰",1],["答對率 ≥ 80%（擊敗守衛）",2],["全對滿星",3]].map(m=>`<div class="ms ${st>=m[1]?"on":""}">${st>=m[1]?"★":"☆"} ${m[0]}</div>`).join("");
const allDone=c1>=TH[8]&&!P.exam;
app.innerHTML=hud(0)+`<div class="card pix ctr"><div class="clear">${st>=2?"STAGE CLEAR!":"TRY AGAIN"}</div><div class="jump" style="margin:10px 0 0">${spr(r1,6)}</div><div class="stars">${[1,2,3].map(x=>`<span style="animation-delay:${x*.25}s">${px(STAR,{a:st>=x?"#f2c21b":"#6b6f80"},5)}</span>`).join("")}</div><div>${G.ok}/${n} 題 · 答對率 ${Math.round(pc*100)}%</div><div style="color:var(--acc)">+${G.xp+bonus+daily} XP${first?"（首次通關 +30）":""}${daily?"（今日首戰 +20）":""}${G.fixed?"（修復 "+G.fixed+" 處裂縫）":""}</div></div>${msg}<div class="card pix">${ms}</div>${g.boss&&first?`<div class="card pix ctr">${px(CROWN,{a:"#2b2118",b:"#e0455a",c:"#ffd24a"},6)}<div>${S.n}大樓過關！</div></div>`:""}${allDone?`<div class="ex">🎓 所有樓層都過關了！到首頁挑戰「技師模擬考」，通過即授予土木技師。</div>`:""}${st<2?`<div class="ex">答對率需達 80% 才能擊敗守衛並解鎖下一關。</div>`:""}<button class="btn" onclick="start(${G.si},${G.i})">${st<2?"再挑戰":"再練一次"}</button>${nextOk?`<button class="btn" onclick="start(${G.si},${G.i+1})">下一關 ▶</button>`:""}<button class="btn g" onclick="isl(${G.si})">回大樓</button>`;
if(r1>r0)setTimeout(()=>lvl(r0,r1),900);else if(st>=2){boom();fan()}scrollTo(0,0)}
/* ---- 技師模擬考 ---- */
const EXN=5,mmss=ms=>{ms=Math.max(0,Math.round(ms/1000));return String(ms/60|0).padStart(2,"0")+":"+String(ms%60).padStart(2,"0")};
let X=null;
function examBuild(){const qs=[];D.forEach((S,si)=>{const o=[];S.st.forEach((g,i)=>{if(!g.boss)o.push(...pool(si,i))});if(si==4)o.push(...CALC.map(mkq));shuf(o).slice(0,EXN).forEach(q=>{q._s=si;qs.push(q)})});return fin(shuf(qs))}
function examIntro(){if(rank(cleared())<7)return;V.v="exam";const n=D.length*EXN;
app.innerHTML=`<div class="tp"><button class="back" onclick="home()">‹ 回工地</button></div><div class="card pix ctr"><div class="clear">技師模擬考</div><div style="margin:12px 0;display:flex;justify-content:center">${spr(8,6)}</div><div style="text-align:left;line-height:2">・九科混合共 ${n} 題，限時 ${n} 分鐘<br>・作答中不顯示對錯，交卷後才覆盤<br>・70% 以上合格<br>・首次合格＋蓋完所有樓層，授予「土木技師」<br>・答錯的題會讓對應樓層出現裂縫</div><button class="btn" onclick="examStart()">開始作答 ▶</button></div>`;scrollTo(0,0)}
function examStart(){const qs=examBuild();X={qs,k:0,ans:[],end:Date.now()+qs.length*60000};X.iv=setInterval(()=>{const l=X.end-Date.now();if(l<=0)xfinish();else{const e=$("#tm");if(e)e.textContent=mmss(l)}},1000);xask()}
function xask(){const q=X.qs[X.k],n=X.qs.length;V.v="exam";
app.innerHTML=`<div class="qt"><button class="x" onclick="xquit()">✕</button><div class="mid2">第 ${X.k+1}/${n} 題 · ${D[q._s].n}</div><span class="cb" id="tm">${mmss(X.end-Date.now())}</span></div><div class="seg" style="margin:0 6px 10px">${seg(X.k/n,24)}</div><div class="card pix"><div class="q">${fx(q.q)}</div>${q.o.map((o,j)=>`<button class="op" onclick="xpick(${j})">${fx(o)}</button>`).join("")}</div>`;scrollTo(0,0)}
function xpick(j){X.ans[X.k]=j;beep(520,.06);X.k++;if(X.k>=X.qs.length)xfinish();else xask()}
function xquit(){if(confirm("放棄本次模擬考？")){clearInterval(X.iv);home()}}
function xfinish(){clearInterval(X.iv);const n=X.qs.length,per=D.map(()=>[0,0]),wr=[];let ok=0;
X.qs.forEach((q,k)=>{per[q._s][1]++;if(X.ans[k]===q.a){ok++;per[q._s][0]++;crFix(q._s,q)}else{wr.push(q);crAdd(q._s,q)}});
const pc=ok/n,pass=pc>=.7,r0=rank(cleared());let xp=ok*6;const first=pass&&!P.exam;if(first){P.exam=1;xp+=200}
P.exambest=Math.max(P.exambest||0,Math.round(pc*100));P.xp+=xp;save();const r1=rank(cleared());V.v="res";
app.innerHTML=hud(0)+`<div class="card pix ctr"><div class="clear">${pass?"EXAM PASSED!":"EXAM FAILED"}</div><div style="margin:10px 0;display:flex;justify-content:center" class="jump">${spr(r1,6)}</div><h2 style="margin:4px 0;font-weight:400">${ok}/${n} 題 · ${Math.round(pc*100)}%</h2><div style="color:var(--acc)">合格線 70% · +${xp} XP${first?"（首次通過 +200）":""}</div></div><div class="card pix">${per.map((p,i)=>`<div class="ms on">${D[i].n}　${p[0]}/${p[1]}</div>`).join("")}</div>${first&&r1==r0?`<div class="ex">已通過模擬考！蓋完所有樓層即授予「土木技師」頭銜。</div>`:""}<div class="vh">答錯題目覆盤（${wr.length}）</div>${wr.map(q=>`<div class="vc pix"><div class="vt">${D[q._s].n}</div><div class="vt" style="color:var(--ink)">${fx(q.q)}</div><div class="vf">${fx(q.o[q.a])}</div>${q.e?`<div class="vd">${fx(q.e)}</div>`:""}</div>`).join("")}<button class="btn" onclick="examIntro()">再考一次</button><button class="btn g" onclick="home()">回工地</button>`;
if(r1>r0)setTimeout(()=>lvl(r0,r1),900);else if(pass){boom();fan()}scrollTo(0,0)}
home();
</script></body></html>
